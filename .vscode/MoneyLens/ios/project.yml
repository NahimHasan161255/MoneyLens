name: MoneyLens
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: MoneyLens
targets:
  MoneyLens:
    type: application
    platform: iOS
    sources:
      - path: MoneyLens/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MoneyLens
        TARGETED_DEVICE_FAMILY: "1"
  MoneyLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyLens/Tests
    dependencies:
      - target: MoneyLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MoneyLensTests
