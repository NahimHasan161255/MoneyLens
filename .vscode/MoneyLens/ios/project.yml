name: MoneyLens
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: MoneyLens
    INFOPLIST_KEY_MoneyLensAPIBaseURL: $(MONEYLENS_API_BASE_URL)
    INFOPLIST_KEY_MoneyLensDevelopmentSessionEnabled: $(MONEYLENS_ENABLE_DEVELOPMENT_SESSION)
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    MONEYLENS_BUNDLE_IDENTIFIER: com.example.MoneyLens
    MONEYLENS_RELEASE_API_BASE_URL: ""
targets:
  MoneyLens:
    type: application
    platform: iOS
    sources:
      - path: MoneyLens/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MONEYLENS_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: MoneyLens/MoneyLens.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          MONEYLENS_API_BASE_URL: http://127.0.0.1:3001
          MONEYLENS_ENABLE_DEVELOPMENT_SESSION: YES
        Release:
          MONEYLENS_API_BASE_URL: $(MONEYLENS_RELEASE_API_BASE_URL)
          MONEYLENS_ENABLE_DEVELOPMENT_SESSION: NO
  MoneyLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyLens/Tests
    dependencies:
      - target: MoneyLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MONEYLENS_BUNDLE_IDENTIFIER).Tests
schemes:
  MoneyLens:
    build:
      targets:
        MoneyLens: all
    test:
      targets:
        - MoneyLensTests
