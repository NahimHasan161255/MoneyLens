name: iOS and backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .vscode/MoneyLens/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .vscode/MoneyLens/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

  ios:
    name: iOS simulator build and tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .vscode/MoneyLens/ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [ -z "$device_id" ]; then
            echo "No available iPhone simulator was found on this runner." >&2
            exit 1
          fi
          echo "id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project MoneyLens.xcodeproj \
            -scheme MoneyLens \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/MoneyLens.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/MoneyLens.xcresult
          if-no-files-found: ignore
